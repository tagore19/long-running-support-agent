name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Cancel any in-progress run on the same branch when a newer push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint → Test → Evals
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Run fully offline / deterministic – no paid API key required in CI.
      LLM_PROVIDER: mock
      LLM_MODE: mock
      AGENT_MODE: improved
      DB_PATH: data/app.db
      SEED_DB_PATH: data/olist_seed.db
      CHECKPOINT_DB_PATH: data/checkpoints.db
      TRACE_LOG_PATH: data/traces/agent_traces.jsonl
      BUSINESS_RULES_PATH: config/business_rules.yaml
      LOG_LEVEL: WARNING

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup + pip caching ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ── Linting ───────────────────────────────────────────────────────────────
      - name: Lint with Ruff
        run: ruff check .

      # ── Database fixtures ─────────────────────────────────────────────────────
      - name: Seed offline SQLite fixtures
        run: python -m scripts.seed_data

      # ── Test suite ────────────────────────────────────────────────────────────
      - name: Run full pytest suite
        run: pytest -q

      # ── Deterministic evals (CI gate: improved ≥ 0.90, violations = 0) ───────
      - name: Run 20 deterministic evals — improved mode
        run: >
          python -m evals.runner
          --mode improved
          --min-score 0.90
          --output data/evals/ci_improved.json

      # ── Upload eval artefact for inspection on PR ─────────────────────────────
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: data/evals/ci_improved.json
          retention-days: 30
